<!DOCTYPE html>
<html lang="sv">
<head>

    <!-- 1. Include the Shoppy Embed Script -->
    <script src="https://shoppy.gg/api/embed.js"></script>

    <style>
        /* Modern Full-Bleed Global Reset */
        body { 
            font-family: system-ui, -apple-system, BlinkMacSystemFont, sans-serif; 
            margin: 0; 
            padding: 0; 
            background: #ffffff; 
            text-align: center; 
            color: #1a1a1a; 
            overflow-x: hidden;
            -webkit-font-smoothing: antialiased;
        }
        
        /* Shopify Standard Ultra-Wide Section Container */
        .shopify-section { 
            width: 80%;
            max-width: 100%;
            padding: 60px 0 0 0; 
            margin: 0 auto;
            box-sizing: border-box;
        }

        /* Text Wrapper to keep typography perfectly readable on huge screens */
        .text-container {
            width: 100%;
            max-width: 100%;
            margin: 0 auto;
            padding: 0 40px;
            box-sizing: border-box;
        }
        
        /* Heading Typography */
        h2 { 
            font-size: 38px; 
            font-weight: 700;
            line-height: 1.25;
            margin: 0 auto 18px auto; 
            max-width: 850px;
            color: #111111;
            letter-spacing: -0.5px;
        }
        
        /* Paragraph Block */
        p { 
            font-size: 16px; 
            color: #4a4a4a; 
            line-height: 1.6; 
            margin: 0 auto 40px auto;
            max-width: 700px;
        }
        
        /* 1:1 Full-Width Premium Image Banner */
        .hero-img { 
            width: 100%; 
            max-width: 100%;
            height: auto; 
            display: block;
            margin: 0 auto;
        }

        /* Perfect Mobile Fluid Repositioning Overrides */
        @media (max-width: 768px) {
            .shopify-section { padding: 32px 0 0 0; }
            .text-container { padding: 0 20px; }
            h2 { font-size: 26px; margin-bottom: 14px; max-width: 100%; }
            p { font-size: 14px; margin-bottom: 28px; max-width: 100%; }
        }
    </style>
</head>
<body>

        </div>

        <!-- Full-Bleed Raw Asset -->
